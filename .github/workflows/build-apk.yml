name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "YouTubeQueueCompanionPro.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q YouTubeQueueCompanionPro.zip
          cp -r YouTubeQueueCompanionPro/. .
          rm -rf YouTubeQueueCompanionPro

      - name: Fix Kotlin source
        run: |
          sed -i 's/val candidate = .*/val candidate = raw.trim().split(" ").firstOrNull { it.contains("youtu") } ?: return null/' app/src/main/java/com/example/youtubequeue/QueueStore.kt

      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Configure Java and Kotlin JVM 17
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Queue-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
